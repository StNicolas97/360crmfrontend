<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Politique de sécurité du contenu (CSP) : limite ce que la page peut charger et exécuter.
      - script-src 'self' : seuls les scripts du CRM (aucun script tiers, aucun script en ligne)
      - style-src 'unsafe-inline' : nécessaire à FullCalendar, qui injecte ses styles par JavaScript
      - connect-src : appels à l'API. Valeur volontairement large (toute adresse https + localhost en dev)
        car l'adresse de l'API est fournie au build (VITE_API_URL). À resserrer sur l'hébergeur
        (en-tête HTTP Content-Security-Policy sur Render) avec l'adresse exacte de l'API.
      - frame-ancestors n'est pas supporté en <meta> : à poser en en-tête HTTP sur l'hébergeur.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="CRM de gestion des travaux de 360 AutoWrap" />
    <meta name="theme-color" content="#111827" />
    <title>360 AutoWrap CRM</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts : pas de SRI possible (la feuille varie selon le navigateur). À auto-héberger (Loi 25, hors ligne). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Ressources CDN à version fixe : empreinte SRI vérifiée (sha384) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
      integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
